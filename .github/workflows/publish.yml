name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ukchucktown/agent-sandbox

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ukchucktown
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.example
          set +a
          docker buildx bake -f compose.yaml \
            --set "sandbox.tags=${IMAGE}:build-${GITHUB_SHA}-${{ matrix.arch }}" \
            --set "sandbox.platform=linux/${{ matrix.arch }}" \
            --push sandbox

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ukchucktown
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assemble and verify multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:build-${GITHUB_SHA}-amd64" \
            "${IMAGE}:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:sha-${GITHUB_SHA}" \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'

      - name: Update latest
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:sha-${GITHUB_SHA}"
