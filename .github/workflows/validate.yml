name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Check shell syntax
        run: |
          for script in sandbox entrypoint.sh scripts/*.sh; do
            bash -n "$script"
          done
          for script in shell/zshrc shell/aliases.zsh shell/fzf.zsh; do
            zsh -n "$script"
          done

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
